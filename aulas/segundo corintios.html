<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz da Segunda Epístola aos Coríntios</title>

  <style>
    :root {
      --dourado: #c9a64f;
      --dourado-escuro: #a9842f;
      --fundo: #242424;
      --cartao: #fffefa;
      --texto: #252525;
      --suave: #777;
      --verde: #237a45;
      --vermelho: #b73535;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(760px, 100%);
    }

    .cartao {
      background: var(--cartao);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 18px 55px #0005;
    }

    header {
      border-bottom: 1px solid #eee;
      padding-bottom: 18px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 4.5vw, 34px);
    }

    .subtitulo {
      color: var(--suave);
      line-height: 1.5;
      margin: 0 0 24px;
    }

    .contador-pergunta {
      color: var(--suave);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .barra-fundo {
      height: 8px;
      overflow: hidden;
      background: #eee9dc;
      border-radius: 99px;
      margin-bottom: 25px;
    }

    .barra {
      height: 100%;
      width: 0;
      background: var(--dourado);
      transition: width 0.25s ease;
    }

    .pergunta {
      font-size: clamp(19px, 3.8vw, 24px);
      line-height: 1.4;
      margin: 0 0 22px;
    }

    .alternativas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .alternativa {
      min-height: 58px;
      padding: 14px 16px;
      border: 1px solid #e7dfca;
      border-radius: 14px;
      background: #f4efe1;
      color: var(--texto);
      text-align: left;
      font-size: 15px;
      line-height: 1.3;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border 0.15s;
    }

    .alternativa:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--dourado);
      background: #eee3c5;
    }

    .alternativa:disabled {
      cursor: default;
    }

    .alternativa.certa {
      background: #e1f2e6;
      border-color: var(--verde);
      color: #155a30;
      font-weight: bold;
    }

    .alternativa.errada {
      background: #fae5e3;
      border-color: var(--vermelho);
      color: #8c2222;
      font-weight: bold;
    }

    .retorno {
      min-height: 28px;
      margin: 17px 0 0;
      font-weight: bold;
      line-height: 1.5;
    }

    .retorno.certa {
      color: var(--verde);
    }

    .retorno.errada {
      color: var(--vermelho);
    }

    .painel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .pontuacao {
      display: flex;
      gap: 16px;
      color: var(--suave);
      font-size: 14px;
    }

    .pontuacao strong {
      color: var(--texto);
    }

    .botoes {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    button.controle {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--dourado);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    button.controle:hover:not(:disabled) {
      background: var(--dourado-escuro);
    }

    button.controle.secundario {
      background: #eee9dc;
      color: var(--texto);
    }

    button.controle.voltar-site {
      background: #333;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.controle.voltar-site:hover {
      background: #555;
    }

    button.controle:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .resultado {
      text-align: center;
      padding: 20px 0 8px;
    }

    .resultado h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      margin: 0 0 10px;
    }

    .nota {
      font-size: 54px;
      font-weight: bold;
      color: var(--dourado-escuro);
      margin: 14px 0;
    }

    .mensagem-final {
      color: var(--suave);
      font-size: 17px;
      line-height: 1.6;
    }

    .oculto {
      display: none;
    }

    @media (max-width: 560px) {
      .cartao {
        padding: 23px 18px;
      }

      .alternativas {
        grid-template-columns: 1fr;
      }

      .painel {
        align-items: stretch;
      }

      .pontuacao {
        width: 100%;
      }

      .botoes {
        width: 100%;
      }

      .botoes button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="cartao">
      <header>
        <h1>Quiz de 2 Coríntios</h1>
        <button class="controle voltar-site" onclick="voltarParaSite()">
          ⬅ Voltar ao Site
        </button>
      </header>

      <p class="subtitulo">
        Responda às 40 perguntas sobre os 13 capítulos e epígrafes da Segunda Epístola aos Coríntios (João Ferreira de Almeida).
        As perguntas e alternativas são embaralhadas a cada tentativa.
      </p>

      <div id="areaPergunta">
        <div class="contador-pergunta" id="contadorPergunta"></div>

        <div class="barra-fundo">
          <div class="barra" id="barra"></div>
        </div>

        <h2 class="pergunta" id="textoPergunta"></h2>
        <div class="alternativas" id="alternativas"></div>
        <p class="retorno" id="retorno" aria-live="polite"></p>

        <div class="painel">
          <div class="pontuacao">
            <span>✅ Certas: <strong id="certas">0</strong></span>
            <span>❌ Erradas: <strong id="erradas">0</strong></span>
          </div>

          <div class="botoes">
            <button class="controle secundario" id="inicio">
              Primeira pergunta
            </button>
            <button class="controle secundario" id="anterior">
              Anterior
            </button>
            <button class="controle" id="proxima">
              Próxima
            </button>
          </div>
        </div>
      </div>

      <div class="resultado oculto" id="resultado"></div>
    </section>
  </main>

  <script>
    // Lista com 40 perguntas baseadas nas epígrafes de 2 Coríntios 1-13 (João Ferreira de Almeida)
    const perguntasOriginais = [
      // Capítulo 1
      { pergunta: "Em qual capítulo de 2 Coríntios está a epígrafe 'O Deus de toda a consolação que nos consola em todas as nossas tribulações'?", opcoes: ["Capítulo 1", "Capítulo 3", "Capítulo 5", "Capítulo 7"], resposta: "Capítulo 1" },
      { pergunta: "O epígrafe 'A aflição de Paulo na Ásia e a explicação sobre a mudança nos planos da viagem a Corinto' pertence a qual capítulo?", opcoes: ["Capítulo 1", "Capítulo 2", "Capítulo 4", "Capítulo 6"], resposta: "Capítulo 1" },

      // Capítulo 2
      { pergunta: "Em qual capítulo o apóstolo instrui sobre 'O perdão e a restauração do irmão que havia causado tristeza'?", opcoes: ["Capítulo 2", "Capítulo 1", "Capítulo 3", "Capítulo 5"], resposta: "Capítulo 2" },
      { pergunta: "O epígrafe 'O bom cheiro (aroma) de Cristo nos que se salvam e nos que se perdem' pertence a qual capítulo?", opcoes: ["Capítulo 2", "Capítulo 4", "Capítulo 6", "Capítulo 8"], resposta: "Capítulo 2" },

      // Capítulo 3
      { pergunta: "Onde encontramos a metáfora 'Vós sois a nossa carta escrita em nossos corações, conhecida e lida por todos os homens'?", opcoes: ["Capítulo 3", "Capítulo 1", "Capítulo 5", "Capítulo 7"], resposta: "Capítulo 3" },
      { pergunta: "O epígrafe 'A superioridade do ministério da Nova Aliança (do Espírito) sobre a Antiga Aliança (da letra)' pertence a qual capítulo?", opcoes: ["Capítulo 3", "Capítulo 2", "Capítulo 4", "Capítulo 6"], resposta: "Capítulo 3" },
      { pergunta: "Em qual capítulo está a gloriosa verdade de que 'O Senhor é o Espírito; e onde está o Espírito do Senhor, aí há liberdade'?", opcoes: ["Capítulo 3", "Capítulo 5", "Capítulo 8", "Capítulo 12"], resposta: "Capítulo 3" },

      // Capítulo 4
      { pergunta: "Em qual capítulo é afirmado que 'O deus deste século cegou os entendimentos dos incrédulos'?", opcoes: ["Capítulo 4", "Capítulo 2", "Capítulo 5", "Capítulo 7"], resposta: "Capítulo 4" },
      { pergunta: "O epígrafe 'Temos este tesouro em vasos de barro para que a excelência do poder seja de Deus' pertence a qual capítulo?", opcoes: ["Capítulo 4", "Capítulo 3", "Capítulo 6", "Capítulo 9"], resposta: "Capítulo 4" },
      { pergunta: "Onde lemos que 'A nossa leve e momentânea tribulação produz para nós um eterno peso de glória'?", opcoes: ["Capítulo 4", "Capítulo 1", "Capítulo 7", "Capítulo 11"], resposta: "Capítulo 4" },

      // Capítulo 5
      { pergunta: "Em qual capítulo está a declaração de esperança: 'Se o nosso tabernáculo terrestre se desfazer, temos de Deus um edifício eterno nos céus'?", opcoes: ["Capítulo 5", "Capítulo 3", "Capítulo 6", "Capítulo 8"], resposta: "Capítulo 5" },
      { pergunta: "O epígrafe 'Porque andamos por fé e não por vista' pertence a qual capítulo?", opcoes: ["Capítulo 5", "Capítulo 2", "Capítulo 4", "Capítulo 7"], resposta: "Capítulo 5" },
      { pergunta: "Onde se encontra o ensino central do 'Ministério da reconciliação e que se alguém está em Cristo, nova criatura é'?", opcoes: ["Capítulo 5", "Capítulo 1", "Capítulo 8", "Capítulo 10"], resposta: "Capítulo 5" },

      // Capítulo 6
      { pergunta: "Em qual capítulo está a exortação 'A não receber a graça de Deus em vão' e 'Eis aqui agora o tempo aceitável'?", opcoes: ["Capítulo 6", "Capítulo 4", "Capítulo 7", "Capítulo 9"], resposta: "Capítulo 6" },
      { pergunta: "O epígrafe 'A advertência solene contra o jugo desigual com os infiéis' pertence a qual capítulo?", opcoes: ["Capítulo 6", "Capítulo 5", "Capítulo 8", "Capítulo 10"], resposta: "Capítulo 6" },

      // Capítulo 7
      { pergunta: "Onde encontramos a exortação 'Purifiquemo-nos de toda a imundícia da carne e do espírito, aperfeiçoando a santificação'?", opcoes: ["Capítulo 7", "Capítulo 5", "Capítulo 8", "Capítulo 11"], resposta: "Capítulo 7" },
      { pergunta: "O epígrafe 'A alegria de Paulo com a chegada de Tito e a diferença entre a tristeza segundo Deus e a tristeza do mundo' pertence a qual capítulo?", opcoes: ["Capítulo 7", "Capítulo 6", "Capítulo 9", "Capítulo 12"], resposta: "Capítulo 7" },

      // Capítulo 8
      { pergunta: "Em qual capítulo é citado 'O exemplo de generosidade e liberalidade das igrejas da Macedônia na oferta aos santos'?", opcoes: ["Capítulo 8", "Capítulo 6", "Capítulo 9", "Capítulo 11"], resposta: "Capítulo 8" },
      { pergunta: "O epígrafe 'Nosso Senhor Jesus Cristo, sendo rico, por amor de vós se fez pobre para que pela sua pobreza enriquecêsseis' pertence a qual capítulo?", opcoes: ["Capítulo 8", "Capítulo 5", "Capítulo 7", "Capítulo 10"], resposta: "Capítulo 8" },

      // Capítulo 9
      { pergunta: "Em qual capítulo está a célebre declaração sobre a contribuição: 'Deus ama ao que dá com alegria'?", opcoes: ["Capítulo 9", "Capítulo 7", "Capítulo 10", "Capítulo 12"], resposta: "Capítulo 9" },
      { pergunta: "O epígrafe 'A promessa de que Deus multiplica a sementeira e a gratidão a Deus pelo seu dom inefável' pertence a qual capítulo?", opcoes: ["Capítulo 9", "Capítulo 8", "Capítulo 11", "Capítulo 13"], resposta: "Capítulo 9" },

      // Capítulo 10
      { pergunta: "Onde encontramos o ensino 'As armas da nossa milícia não são carnais, mas sim poderosas em Deus para destruição de fortalezas'?", opcoes: ["Capítulo 10", "Capítulo 6", "Capítulo 8", "Capítulo 12"], resposta: "Capítulo 10" },
      { pergunta: "O epígrafe 'A defesa da autoridade apostólica de Paulo e o dever de gloriar-se somente no Senhor' pertence a qual capítulo?", opcoes: ["Capítulo 10", "Capítulo 9", "Capítulo 11", "Capítulo 13"], resposta: "Capítulo 10" },

      // Capítulo 11
      { pergunta: "Em qual capítulo Paulo expressa o receio de que a igreja seja 'corrompida da simplicidade que há em Cristo por falsos apóstolos'?", opcoes: ["Capítulo 11", "Capítulo 9", "Capítulo 12", "Capítulo 13"], resposta: "Capítulo 11" },
      { pergunta: "O epígrafe em que Paulo enumera as suas muitas tribulações, açoitamentos, perigos e naufrágios por amor do Evangelho é de qual capítulo?", opcoes: ["Capítulo 11", "Capítulo 8", "Capítulo 10", "Capítulo 12"], resposta: "Capítulo 11" },

      // Capítulo 12
      { pergunta: "Em qual capítulo o apóstolo relata ter sido 'arrebatado ao terceiro céu e ao paraíso'?", opcoes: ["Capítulo 12", "Capítulo 10", "Capítulo 11", "Capítulo 13"], resposta: "Capítulo 12" },
      { pergunta: "Onde se encontra a célebre resposta de Deus ao espinho na carne de Paulo: 'A minha graça te basta, porque o meu poder se aperfeiçoa na fraqueza'?", opcoes: ["Capítulo 12", "Capítulo 8", "Capítulo 10", "Capítulo 13"], resposta: "Capítulo 12" },

      // Capítulo 13
      { pergunta: "Em qual capítulo está a solene exortação: 'Examinai-vos a vós mesmos se estais na fé; provai-vos a vós mesmos'?", opcoes: ["Capítulo 13", "Capítulo 10", "Capítulo 11", "Capítulo 12"], resposta: "Capítulo 13" },
      { pergunta: "O epígrafe que traz a benção apostólica trinitária ('A graça do Senhor Jesus Cristo, o amor de Deus e a comunhão do Espírito Santo sejam com todos vós') encerra qual capítulo?", opcoes: ["Capítulo 13", "Capítulo 10", "Capítulo 11", "Capítulo 12"], resposta: "Capítulo 13" },

      // Perguntas Complementares
      { pergunta: "A advertência 'Não vos ponhais em jugo desigual com os incrédulos' está registrada em qual capítulo de 2 Coríntios?", opcoes: ["Capítulo 6", "Capítulo 3", "Capítulo 8", "Capítulo 11"], resposta: "Capítulo 6" },
      { pergunta: "Em qual capítulo Paulo fala sobre o 'espírito de fé' e a renovação diária do homem interior?", opcoes: ["Capítulo 4", "Capítulo 2", "Capítulo 5", "Capítulo 9"], resposta: "Capítulo 4" },
      { pergunta: "O epígrafe sobre a recomendação de Tito como parceiro e cooperador de Paulo na coleta pertence a qual capítulo?", opcoes: ["Capítulo 8", "Capítulo 6", "Capítulo 10", "Capítulo 12"], resposta: "Capítulo 8" },
      { pergunta: "Em qual capítulo encontramos 'Porque a tristeza segundo Deus opera arrependimento para a salvação'?", opcoes: ["Capítulo 7", "Capítulo 5", "Capítulo 9", "Capítulo 11"], resposta: "Capítulo 7" },
      { pergunta: "A afirmação 'De sorte que, se alguém está em Cristo, nova criatura é; as coisas velhas já passaram' está em qual capítulo?", opcoes: ["Capítulo 5", "Capítulo 3", "Capítulo 7", "Capítulo 12"], resposta: "Capítulo 5" },
      { pergunta: "Onde se localiza a frase 'Anunciamos a Cristo não por vaidade, mas como servos por amor de Jesus'?", opcoes: ["Capítulo 4", "Capítulo 1", "Capítulo 6", "Capítulo 10"], resposta: "Capítulo 4" },
      { pergunta: "O capítulo em que Paulo declara 'Porque o amor de Cristo nos constrange' é o:", opcoes: ["Capítulo 5", "Capítulo 3", "Capítulo 8", "Capítulo 13"], resposta: "Capítulo 5" },
      { pergunta: "Em qual capítulo de 2 Coríntios é enfatizado que 'Na boca de duas ou três testemunhas se confirmará toda a palavra'?", opcoes: ["Capítulo 13", "Capítulo 10", "Capítulo 11", "Capítulo 12"], resposta: "Capítulo 13" },
      { pergunta: "A declaração 'Suficiente é ao tal esta repreensão feita por muitos' no processo de restauração do faltoso está no:", opcoes: ["Capítulo 2", "Capítulo 1", "Capítulo 4", "Capítulo 7"], resposta: "Capítulo 2" },
      { pergunta: "O ensino de que 'Deus é poderoso para fazer abundar em vós toda a graça' para toda boa obra está no:", opcoes: ["Capítulo 9", "Capítulo 6", "Capítulo 8", "Capítulo 11"], resposta: "Capítulo 9" },
      { pergunta: "Em qual capítulo de 2 Coríntios Paulo menciona que foi 'açoitado pelos judeus cinco vezes com quarenta chicotadas menos uma'?", opcoes: ["Capítulo 11", "Capítulo 9", "Capítulo 10", "Capítulo 12"], resposta: "Capítulo 11" }
    ];

    function embaralhar(lista) {
      const copia = [...lista];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    let perguntas = [];
    let indice = 0;
    let respostas = [];

    const contadorPergunta = document.getElementById("contadorPergunta");
    const barra = document.getElementById("barra");
    const textoPergunta = document.getElementById("textoPergunta");
    const alternativas = document.getElementById("alternativas");
    const retorno = document.getElementById("retorno");
    const certas = document.getElementById("certas");
    const erradas = document.getElementById("erradas");
    const botaoInicio = document.getElementById("inicio");
    const botaoAnterior = document.getElementById("anterior");
    const botaoProxima = document.getElementById("proxima");
    const areaPergunta = document.getElementById("areaPergunta");
    const areaResultado = document.getElementById("resultado");

    function voltarParaSite() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    }

    function atualizarPontuacao() {
      const totalCertas = respostas.filter(
        resposta => resposta !== null && resposta.correta
      ).length;

      const totalErradas = respostas.filter(
        resposta => resposta !== null && !resposta.correta
      ).length;

      certas.textContent = totalCertas;
      erradas.textContent = totalErradas;
    }

    function iniciarQuiz() {
      perguntas = embaralhar(perguntasOriginais).map(pergunta => ({
        ...pergunta,
        opcoesEmbaralhadas: embaralhar(pergunta.opcoes)
      }));

      indice = 0;
      respostas = Array(perguntas.length).fill(null);

      areaPergunta.classList.remove("oculto");
      areaResultado.classList.add("oculto");

      atualizarPontuacao();
      mostrarPergunta();
    }

    function responder(escolhida) {
      if (respostas[indice] !== null) {
        return;
      }

      const respostaCorreta = perguntas[indice].resposta;
      const correta = escolhida === respostaCorreta;

      respostas[indice] = {
        escolhida: escolhida,
        correta: correta
      };

      atualizarPontuacao();
      mostrarPergunta();
    }

    function mostrarPergunta() {
      const atual = perguntas[indice];
      const registro = respostas[indice];

      contadorPergunta.textContent =
        `Pergunta ${indice + 1} de ${perguntas.length}`;

      barra.style.width =
        `${((indice + 1) / perguntas.length) * 100}%`;

      textoPergunta.textContent = atual.pergunta;
      alternativas.innerHTML = "";
      retorno.textContent = "";
      retorno.className = "retorno";

      atual.opcoesEmbaralhadas.forEach(opcao => {
        const botao = document.createElement("button");
        botao.type = "button";
        botao.className = "alternativa";
        botao.textContent = opcao;

        if (registro !== null) {
          botao.disabled = true;

          if (opcao === atual.resposta) {
            botao.classList.add("certa");
          } else if (opcao === registro.escolhida) {
            botao.classList.add("errada");
          }
        } else {
          botao.addEventListener("click", () => responder(opcao));
        }

        alternativas.appendChild(botao);
      });

      if (registro !== null) {
        if (registro.correta) {
          retorno.textContent = "Correto! Muito bem.";
          retorno.classList.add("certa");
        } else {
          retorno.textContent =
            `Resposta incorreta. A alternativa certa é: ${atual.resposta}`;
          retorno.classList.add("errada");
        }
      }

      botaoInicio.disabled = indice === 0;
      botaoAnterior.disabled = indice === 0;

      botaoProxima.textContent =
        indice === perguntas.length - 1 ? "Ver resultado" : "Próxima";

      atualizarPontuacao();
    }

    function mostrarResultado() {
      const totalCertas = respostas.filter(
        resposta => resposta !== null && resposta.correta
      ).length;

      const totalErradas = respostas.filter(
        resposta => resposta !== null && !resposta.correta
      ).length;

      const porcentagem = Math.round(
        (totalCertas / perguntas.length) * 100
      );

      let nivel;
      let mensagem;

      if (porcentagem < 25) {
        nivel = "Mal";
        mensagem = "Continue estudando a Segunda Epístola aos Coríntios e tente novamente.";
      } else if (porcentagem < 50) {
        nivel = "Médio";
        mensagem = "Você está avançando. Revise os capítulos e tente novamente.";
      } else if (porcentagem < 75) {
        nivel = "Bom";
        mensagem = "Bom trabalho! Você conhece grande parte de 2 Coríntios.";
      } else {
        nivel = "Excelente";
        mensagem = "Excelente resultado! Você demonstrou domínio impressionante das epígrafes!";
      }

      areaPergunta.classList.add("oculto");
      areaResultado.classList.remove("oculto");

      areaResultado.innerHTML = `
        <h2>Resultado final</h2>
        <div class="nota">${porcentagem}%</div>
        <p><strong>${nivel}</strong></p>
        <p class="mensagem-final">
          Você acertou <strong>${totalCertas}</strong> e errou
          <strong>${totalErradas}</strong> de ${perguntas.length} perguntas.<br>
          ${mensagem}
        </p>

        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px;">
          <button class="controle" id="novaTentativa">Nova tentativa</button>
          <button class="controle secundario" onclick="voltarParaSite()">Voltar ao Site</button>
        </div>
      `;

      document
        .getElementById("novaTentativa")
        .addEventListener("click", iniciarQuiz);
    }

    botaoInicio.addEventListener("click", () => {
      indice = 0;
      mostrarPergunta();
    });

    botaoAnterior.addEventListener("click", () => {
      if (indice > 0) {
        indice--;
        mostrarPergunta();
      }
    });

    botaoProxima.addEventListener("click", () => {
      if (indice < perguntas.length - 1) {
        indice++;
        mostrarPergunta();
      } else {
        mostrarResultado();
      }
    });

    iniciarQuiz();
  </script>
</body>
</html>
