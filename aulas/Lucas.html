<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz do Evangelho de Lucas</title>

  <style>
    :root {
      --dourado: #c9a64f;
      --dourado-escuro: #a9842f;
      --fundo: #242424;
      --cartao: #fffefa;
      --texto: #252525;
      --suave: #777;
      --verde: #237a45;
      --vermelho: #b73535;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(760px, 100%);
    }

    .cartao {
      background: var(--cartao);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 18px 55px #0005;
    }

    header {
      border-bottom: 1px solid #eee;
      padding-bottom: 18px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 4.5vw, 34px);
    }

    .subtitulo {
      color: var(--suave);
      line-height: 1.5;
      margin: 0 0 24px;
    }

    .campo-identificacao {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .campo-identificacao input {
      padding: 14px;
      border: 1px solid #e7dfca;
      border-radius: 10px;
      font-size: 16px;
      background: #fdfbf7;
    }

    .contador-pergunta {
      color: var(--suave);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .barra-fundo {
      height: 8px;
      overflow: hidden;
      background: #eee9dc;
      border-radius: 99px;
      margin-bottom: 25px;
    }

    .barra {
      height: 100%;
      width: 0;
      background: var(--dourado);
      transition: width 0.25s ease;
    }

    .pergunta {
      font-size: clamp(19px, 3.8vw, 24px);
      line-height: 1.4;
      margin: 0 0 22px;
    }

    .alternativas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .alternativa {
      min-height: 58px;
      padding: 14px 16px;
      border: 1px solid #e7dfca;
      border-radius: 14px;
      background: #f4efe1;
      color: var(--texto);
      text-align: left;
      font-size: 15px;
      line-height: 1.3;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border 0.15s;
    }

    .alternativa:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--dourado);
      background: #eee3c5;
    }

    .alternativa:disabled {
      cursor: default;
    }

    .alternativa.certa {
      background: #e1f2e6;
      border-color: var(--verde);
      color: #155a30;
      font-weight: bold;
    }

    .alternativa.errada {
      background: #fae5e3;
      border-color: var(--vermelho);
      color: #8c2222;
      font-weight: bold;
    }

    .retorno {
      min-height: 28px;
      margin: 17px 0 0;
      font-weight: bold;
      line-height: 1.5;
    }

    .retorno.certa {
      color: var(--verde);
    }

    .retorno.errada {
      color: var(--vermelho);
    }

    .painel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .pontuacao {
      display: flex;
      gap: 16px;
      color: var(--suave);
      font-size: 14px;
    }

    .pontuacao strong {
      color: var(--texto);
    }

    .botoes {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    button.controle {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--dourado);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    button.controle:hover:not(:disabled) {
      background: var(--dourado-escuro);
    }

    button.controle.secundario {
      background: #eee9dc;
      color: var(--texto);
    }

    button.controle.voltar-site {
      background: #333;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.controle.voltar-site:hover {
      background: #555;
    }

    button.controle:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .resultado {
      text-align: center;
      padding: 20px 0 8px;
    }

    .resultado h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      margin: 0 0 10px;
    }

    .nota {
      font-size: 54px;
      font-weight: bold;
      color: var(--dourado-escuro);
      margin: 14px 0;
    }

    .mensagem-final {
      color: var(--suave);
      font-size: 17px;
      line-height: 1.6;
    }

    .status-envio {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #e1f2e6;
      border: 1px solid var(--verde);
      color: #155a30;
      font-weight: bold;
      font-size: 15px;
    }

    .oculto {
      display: none;
    }

    @media (max-width: 560px) {
      .cartao {
        padding: 23px 18px;
      }

      .alternativas {
        grid-template-columns: 1fr;
      }

      .painel {
        align-items: stretch;
      }

      .pontuacao {
        width: 100%;
      }

      .botoes {
        width: 100%;
      }

      .botoes button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="cartao">
      <header>
        <h1>Quiz do Evangelho de Lucas</h1>
        <button class="controle voltar-site" onclick="voltarParaSite()">
          ⬅ Voltar ao Site
        </button>
      </header>

      <!-- Tela 1: Identificação do Aluno -->
      <div id="areaRegistro">
        <p class="subtitulo">
          A Paz de Deus! Antes de começar o questionário sobre o Evangelho de Lucas, informe o seu Nome e o seu E-mail para registrar o seu resultado.
        </p>
        <form id="formRegistro" class="campo-identificacao" onsubmit="confirmarRegistro(event)">
          <input type="text" id="nomeUsuario" placeholder="Seu Nome Completo" required>
          <input type="email" id="emailUsuario" placeholder="Seu E-mail" required>
          <button type="submit" class="controle">Iniciar Quiz</button>
        </form>
      </div>

      <!-- Tela 2: Perguntas -->
      <div id="areaPergunta" class="oculto">
        <div class="contador-pergunta" id="contadorPergunta"></div>

        <div class="barra-fundo">
          <div class="barra" id="barra"></div>
        </div>

        <h2 class="pergunta" id="textoPergunta"></h2>
        <div class="alternativas" id="alternativas"></div>
        <p class="retorno" id="retorno" aria-live="polite"></p>

        <div class="painel">
          <div class="pontuacao">
            <span>✅ Certas: <strong id="certas">0</strong></span>
            <span>❌ Erradas: <strong id="erradas">0</strong></span>
          </div>

          <div class="botoes">
            <button class="controle secundario" id="inicio" onclick="irParaPergunta(0)">
              Primeira
            </button>
            <button class="controle secundario" id="anterior" onclick="perguntaAnterior()">
              Anterior
            </button>
            <button class="controle" id="proxima" onclick="proximaPergunta()">
              Próxima
            </button>
          </div>
        </div>
      </div>

      <!-- Tela 3: Resultado Final -->
      <div class="resultado oculto" id="resultado"></div>
    </section>
  </main>

  <script>
    // E-mail fixo para o qual todas as mensagens diretas são enviadas
    const EMAIL_DESTINO = "comumcongregacao@gmail.com";

    // 40 Perguntas sobre as epígrafes do Evangelho de Lucas
    const perguntasOriginais = [
      { pergunta: "Em qual capítulo está a epígrafe 'O anúncio do nascimento de João Batista e de Jesus'?", opcoes: ["Capítulo 1", "Capítulo 3", "Capítulo 5", "Capítulo 7"], resposta: "Capítulo 1" },
      { pergunta: "Onde encontramos o cântico de Maria (Magnificat) e o cântico de Zacarias?", opcoes: ["Capítulo 1", "Capítulo 2", "Capítulo 4", "Capítulo 6"], resposta: "Capítulo 1" },
      { pergunta: "A epígrafe 'O nascimento de Jesus em Belém e o canto dos anjos aos pastores' pertence a qual capítulo?", opcoes: ["Capítulo 2", "Capítulo 1", "Capítulo 3", "Capítulo 5"], resposta: "Capítulo 2" },
      { pergunta: "Em qual capítulo se encontra o episódio de 'Jesus no templo aos doze anos'?", opcoes: ["Capítulo 2", "Capítulo 4", "Capítulo 8", "Capítulo 12"], resposta: "Capítulo 2" },
      { pergunta: "Em qual capítulo encontramos 'A pregação de João Batista, o batismo e a genealogia de Jesus'?", opcoes: ["Capítulo 3", "Capítulo 1", "Capítulo 5", "Capítulo 9"], resposta: "Capítulo 3" },
      { pergunta: "A epígrafe 'A tentação de Jesus no deserto e a rejeição em Nazaré' pertence a qual capítulo?", opcoes: ["Capítulo 4", "Capítulo 2", "Capítulo 6", "Capítulo 10"], resposta: "Capítulo 4" },
      { pergunta: "Em qual capítulo ocorre 'A cura da sogra de Pedro e de muitos enfermos em Cafarnaum'?", opcoes: ["Capítulo 4", "Capítulo 7", "Capítulo 11", "Capítulo 13"], resposta: "Capítulo 4" },
      { pergunta: "Onde encontramos o relato da 'Pesca maravilhosa e o chamamento dos primeiros discípulos'?", opcoes: ["Capítulo 5", "Capítulo 3", "Capítulo 8", "Capítulo 12"], resposta: "Capítulo 5" },
      { pergunta: "A epígrafe 'A cura de um paralítico baixado pelo telhado e a vocação de Levi' é de qual capítulo?", opcoes: ["Capítulo 5", "Capítulo 2", "Capítulo 6", "Capítulo 9"], resposta: "Capítulo 5" },
      { pergunta: "Em qual capítulo está 'A escolha dos doze apóstolos e o Sermão da Planície'?", opcoes: ["Capítulo 6", "Capítulo 5", "Capítulo 7", "Capítulo 10"], resposta: "Capítulo 6" },
      { pergunta: "A epígrafe 'Jesus é o Senhor do sábado e a cura da mão ressequida' pertence a qual capítulo?", opcoes: ["Capítulo 6", "Capítulo 4", "Capítulo 8", "Capítulo 11"], resposta: "Capítulo 6" },
      { pergunta: "Onde se encontra 'A cura do servo do centurião e a ressurreição do filho da viúva de Naim'?", opcoes: ["Capítulo 7", "Capítulo 5", "Capítulo 9", "Capítulo 14"], resposta: "Capítulo 7" },
      { pergunta: "Em qual capítulo ocorre 'A unção de Jesus por uma mulher pecadora na casa do fariseu'?", opcoes: ["Capítulo 7", "Capítulo 8", "Capítulo 10", "Capítulo 12"], resposta: "Capítulo 7" },
      { pergunta: "A epígrafe 'A parábola do semeador' e 'Jesus acalma a tempestade' pertence a qual capítulo?", opcoes: ["Capítulo 8", "Capítulo 4", "Capítulo 9", "Capítulo 13"], resposta: "Capítulo 8" },
      { pergunta: "Em qual capítulo ocorre 'A cura da mulher com fluxo de sangue e a ressurreição da filha de Jairo'?", opcoes: ["Capítulo 8", "Capítulo 6", "Capítulo 11", "Capítulo 15"], resposta: "Capítulo 8" },
      { pergunta: "A epígrafe 'A missão dos doze apóstolos, a multiplicação dos pães e a Transfiguração' está em qual capítulo?", opcoes: ["Capítulo 9", "Capítulo 7", "Capítulo 10", "Capítulo 12"], resposta: "Capítulo 9" },
      { pergunta: "Em qual capítulo encontramos a pergunta de Jesus: 'E vós, quem dizeis que eu sou?' (A confissão de Pedro)?", opcoes: ["Capítulo 9", "Capítulo 8", "Capítulo 14", "Capítulo 16"], resposta: "Capítulo 9" },
      { pergunta: "Onde se encontra 'A missão dos setenta discípulos e a parábola do bom samaritano'?", opcoes: ["Capítulo 10", "Capítulo 6", "Capítulo 12", "Capítulo 15"], resposta: "Capítulo 10" },
      { pergunta: "A epígrafe 'Jesus na casa de Marta e Maria' pertence a qual capítulo?", opcoes: ["Capítulo 10", "Capítulo 9", "Capítulo 11", "Capítulo 13"], resposta: "Capítulo 10" },
      { pergunta: "Em qual capítulo está o ensino da oração do 'Pai Nosso' e o 'Pedi, buscai e batei' em Lucas?", opcoes: ["Capítulo 11", "Capítulo 6", "Capítulo 12", "Capítulo 18"], resposta: "Capítulo 11" },
      { pergunta: "A epígrafe 'O sinal de Jonas e os ais contra os fariseus' encontra-se em qual capítulo?", opcoes: ["Capítulo 11", "Capítulo 7", "Capítulo 13", "Capítulo 16"], resposta: "Capítulo 11" },
      { pergunta: "Onde está a 'Parábola do rico insensato' e a 'Exortação contra a ansiedade'?", opcoes: ["Capítulo 12", "Capítulo 8", "Capítulo 10", "Capítulo 14"], resposta: "Capítulo 12" },
      { pergunta: "Em qual capítulo encontramos 'A cura de uma mulher encurvada no sábado e a porta estreita'?", opcoes: ["Capítulo 13", "Capítulo 9", "Capítulo 14", "Capítulo 17"], resposta: "Capítulo 13" },
      { pergunta: "As parábolas do 'Grão de mostarda e do fermento' no Evangelho de Lucas estão em qual capítulo?", opcoes: ["Capítulo 13", "Capítulo 11", "Capítulo 15", "Capítulo 18"], resposta: "Capítulo 13" },
      { pergunta: "A epígrafe 'A cura de um hidrópico e a parábola da grande ceia' é de qual capítulo?", opcoes: ["Capítulo 14", "Capítulo 10", "Capítulo 12", "Capítulo 16"], resposta: "Capítulo 14" },
      { pergunta: "Em qual capítulo estão as três parábolas da graça: 'A ovelha perdida, a dracma perdida e o filho pródigo'?", opcoes: ["Capítulo 15", "Capítulo 12", "Capítulo 16", "Capítulo 19"], resposta: "Capítulo 15" },
      { pergunta: "A epígrafe 'A parábola do mordomo infiel e a história do rico e Lázaro' pertence a qual capítulo?", opcoes: ["Capítulo 16", "Capítulo 13", "Capítulo 15", "Capítulo 18"], resposta: "Capítulo 16" },
      { pergunta: "Em qual capítulo está registrada 'A cura dos dez leprosos' e os ensinos sobre a 'Vinda do Reino'?", opcoes: ["Capítulo 17", "Capítulo 14", "Capítulo 18", "Capítulo 20"], resposta: "Capítulo 17" },
      { pergunta: "Onde encontramos a 'Parábola do fariseu e do publicano' e o 'Jovem rico'?", opcoes: ["Capítulo 18", "Capítulo 15", "Capítulo 19", "Capítulo 21"], resposta: "Capítulo 18" },
      { pergunta: "A epígrafe 'A cura do cego de Jericó' está localizado em qual capítulo?", opcoes: ["Capítulo 18", "Capítulo 16", "Capítulo 20", "Capítulo 22"], resposta: "Capítulo 18" },
      { pergunta: "Em qual capítulo ocorre 'A conversão de Zaqueu, o publicano' e a 'Parábola das minas'?", opcoes: ["Capítulo 19", "Capítulo 17", "Capítulo 20", "Capítulo 22"], resposta: "Capítulo 19" },
      { pergunta: "A epígrafe 'A entrada triunfal de Jesus em Jerusalém e o lamento sobre a cidade' pertence a qual capítulo?", opcoes: ["Capítulo 19", "Capítulo 18", "Capítulo 21", "Capítulo 23"], resposta: "Capítulo 19" },
      { pergunta: "Em qual capítulo se encontra 'A parábola dos lavradores maus' e a questão do 'Tributo a César'?", opcoes: ["Capítulo 20", "Capítulo 17", "Capítulo 21", "Capítulo 23"], resposta: "Capítulo 20" },
      { pergunta: "A epígrafe 'A oferta da viúva pobre e o anúncio da destruição do templo' pertence a qual capítulo?", opcoes: ["Capítulo 21", "Capítulo 19", "Capítulo 22", "Capítulo 24"], resposta: "Capítulo 21" },
      { pergunta: "Em qual capítulo está 'A traição de Judas, a instituição da Ceia do Senhor e a oração no Getsêmani'?", opcoes: ["Capítulo 22", "Capítulo 20", "Capítulo 21", "Capítulo 23"], resposta: "Capítulo 22" },
      { pergunta: "A epígrafe 'A prisão de Jesus e a negação de Pedro' pertence a qual capítulo?", opcoes: ["Capítulo 22", "Capítulo 19", "Capítulo 23", "Capítulo 24"], resposta: "Capítulo 22" },
      { pergunta: "Onde se encontra o julgamento perante Pilatos e Herodes, a crucificação e 'O bom ladrão na cruz'?", opcoes: ["Capítulo 23", "Capítulo 21", "Capítulo 22", "Capítulo 24"], resposta: "Capítulo 23" },
      { pergunta: "A epígrafe 'A morte de Jesus e o sepultamento por José de Arimatéia' é de qual capítulo?", opcoes: ["Capítulo 23", "Capítulo 20", "Capítulo 22", "Capítulo 24"], resposta: "Capítulo 23" },
      { pergunta: "Em qual capítulo ocorre o episódio marcante dos 'Discípulos no caminho de Emaús'?", opcoes: ["Capítulo 24", "Capítulo 21", "Capítulo 22", "Capítulo 23"], resposta: "Capítulo 24" },
      { pergunta: "A epígrafe 'A ressurreição de Jesus, a aparição aos apóstolos e a Ascensão ao céu' pertence a qual capítulo?", opcoes: ["Capítulo 24", "Capítulo 20", "Capítulo 22", "Capítulo 23"], resposta: "Capítulo 24" }
