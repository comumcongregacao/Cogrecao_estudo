<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz do Evangelho de Marcos</title>

  <style>
    :root {
      --dourado: #c9a64f;
      --dourado-escuro: #a9842f;
      --fundo: #242424;
      --cartao: #fffefa;
      --texto: #252525;
      --suave: #777;
      --verde: #237a45;
      --vermelho: #b73535;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(760px, 100%);
    }

    .cartao {
      background: var(--cartao);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 18px 55px #0005;
    }

    header {
      border-bottom: 1px solid #eee;
      padding-bottom: 18px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 4.5vw, 34px);
    }

    .subtitulo {
      color: var(--suave);
      line-height: 1.5;
      margin: 0 0 24px;
    }

    .campo-identificacao {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .campo-identificacao input {
      padding: 14px;
      border: 1px solid #e7dfca;
      border-radius: 10px;
      font-size: 16px;
      background: #fdfbf7;
    }

    .contador-pergunta {
      color: var(--suave);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .barra-fundo {
      height: 8px;
      overflow: hidden;
      background: #eee9dc;
      border-radius: 99px;
      margin-bottom: 25px;
    }

    .barra {
      height: 100%;
      width: 0;
      background: var(--dourado);
      transition: width 0.25s ease;
    }

    .pergunta {
      font-size: clamp(19px, 3.8vw, 24px);
      line-height: 1.4;
      margin: 0 0 22px;
    }

    .alternativas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .alternativa {
      min-height: 58px;
      padding: 14px 16px;
      border: 1px solid #e7dfca;
      border-radius: 14px;
      background: #f4efe1;
      color: var(--texto);
      text-align: left;
      font-size: 15px;
      line-height: 1.3;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border 0.15s;
    }

    .alternativa:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--dourado);
      background: #eee3c5;
    }

    .alternativa:disabled {
      cursor: default;
    }

    .alternativa.certa {
      background: #e1f2e6;
      border-color: var(--verde);
      color: #155a30;
      font-weight: bold;
    }

    .alternativa.errada {
      background: #fae5e3;
      border-color: var(--vermelho);
      color: #8c2222;
      font-weight: bold;
    }

    .retorno {
      min-height: 28px;
      margin: 17px 0 0;
      font-weight: bold;
      line-height: 1.5;
    }

    .retorno.certa {
      color: var(--verde);
    }

    .retorno.errada {
      color: var(--vermelho);
    }

    .painel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .pontuacao {
      display: flex;
      gap: 16px;
      color: var(--suave);
      font-size: 14px;
    }

    .pontuacao strong {
      color: var(--texto);
    }

    .botoes {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    button.controle {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--dourado);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    button.controle:hover:not(:disabled) {
      background: var(--dourado-escuro);
    }

    button.controle.secundario {
      background: #eee9dc;
      color: var(--texto);
    }

    button.controle.voltar-site {
      background: #333;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.controle.voltar-site:hover {
      background: #555;
    }

    button.controle:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .resultado {
      text-align: center;
      padding: 20px 0 8px;
    }

    .resultado h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      margin: 0 0 10px;
    }

    .nota {
      font-size: 54px;
      font-weight: bold;
      color: var(--dourado-escuro);
      margin: 14px 0;
    }

    .mensagem-final {
      color: var(--suave);
      font-size: 17px;
      line-height: 1.6;
    }

    .status-envio {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #e1f2e6;
      border: 1px solid var(--verde);
      color: #155a30;
      font-weight: bold;
      font-size: 15px;
    }

    .oculto {
      display: none;
    }

    @media (max-width: 560px) {
      .cartao {
        padding: 23px 18px;
      }

      .alternativas {
        grid-template-columns: 1fr;
      }

      .painel {
        align-items: stretch;
      }

      .pontuacao {
        width: 100%;
      }

      .botoes {
        width: 100%;
      }

      .botoes button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="cartao">
      <header>
        <h1>Quiz do Evangelho de Marcos</h1>
        <button class="controle voltar-site" onclick="voltarParaSite()">
          ⬅ Voltar ao Site
        </button>
      </header>

      <!-- Tela 1: Identificação de Nome e E-mail -->
      <div id="areaRegistro">
        <p class="subtitulo">
          A Paz de Deus! Antes de começar o questionário sobre o Evangelho de Marcos, informe o seu Nome e o seu E-mail para registrar o seu resultado.
        </p>
        <form id="formRegistro" class="campo-identificacao" onsubmit="confirmarRegistro(event)">
          <input type="text" id="nomeUsuario" placeholder="Seu Nome Completo" required>
          <input type="email" id="emailUsuario" placeholder="Seu E-mail" required>
          <button type="submit" class="controle">Iniciar Quiz</button>
        </form>
      </div>

      <!-- Tela 2: Pergunta do Quiz -->
      <div id="areaPergunta" class="oculto">
        <div class="contador-pergunta" id="contadorPergunta"></div>

        <div class="barra-fundo">
          <div class="barra" id="barra"></div>
        </div>

        <h2 class="pergunta" id="textoPergunta"></h2>
        <div class="alternativas" id="alternativas"></div>
        <p class="retorno" id="retorno" aria-live="polite"></p>

        <div class="painel">
          <div class="pontuacao">
            <span>✅ Certas: <strong id="certas">0</strong></span>
            <span>❌ Erradas: <strong id="erradas">0</strong></span>
          </div>

          <div class="botoes">
            <button class="controle secundario" id="inicio" onclick="irParaPergunta(0)">
              Primeira
            </button>
            <button class="controle secundario" id="anterior" onclick="perguntaAnterior()">
              Anterior
            </button>
            <button class="controle" id="proxima" onclick="proximaPergunta()">
              Próxima
            </button>
          </div>
        </div>
      </div>

      <!-- Tela 3: Resultado Final -->
      <div class="resultado oculto" id="resultado"></div>
    </section>
  </main>

  <script>
    const EMAIL_DESTINO = "comumcongregacao@gmail.com";

    // Banco rigorosamente estruturado com exatamente 40 perguntas cobrindo todos os 16 capítulos
    const perguntasOriginais = [
      // Capítulo 1
      { pergunta: "Em qual capítulo está o relato sobre João Batista e o batismo de Jesus?", opcoes: ["Capítulo 1", "Capítulo 3", "Capítulo 6", "Capítulo 10"], resposta: "Capítulo 1" },
      // Capítulo 2
      { pergunta: "Em qual capítulo ocorre a cura do paralítico que foi descido pelo telhado?", opcoes: ["Capítulo 2", "Capítulo 4", "Capítulo 8", "Capítulo 12"], resposta: "Capítulo 2" },
      // Capítulo 3
      { pergunta: "Onde encontramos a eleição dos doze apóstolos?", opcoes: ["Capítulo 3", "Capítulo 1", "Capítulo 5", "Capítulo 9"], resposta: "Capítulo 3" },
      // Capítulo 4
      { pergunta: "Em qual capítulo Jesus profere a Parábola do Semeador?", opcoes: ["Capítulo 4", "Capítulo 2", "Capítulo 7", "Capítulo 11"], resposta: "Capítulo 4" },
      // Capítulo 5
      { pergunta: "Onde se registra a cura da filha de Jairo e da mulher com fluxo de sangue?", opcoes: ["Capítulo 5", "Capítulo 3", "Capítulo 8", "Capítulo 13"], resposta: "Capítulo 5" },
      // Capítulo 6
      { pergunta: "Em qual capítulo acontece a primeira multiplicação dos pães e Jesus andando sobre o mar?", opcoes: ["Capítulo 6", "Capítulo 4", "Capítulo 9", "Capítulo 14"], resposta: "Capítulo 6" },
      // Capítulo 7
      { pergunta: "Onde lemos sobre a fé da mulher siro-fenícia e a cura do surdo e gago?", opcoes: ["Capítulo 7", "Capítulo 2", "Capítulo 5", "Capítulo 10"], resposta: "Capítulo 7" },
      // Capítulo 8
      { pergunta: "Em qual capítulo Pedro faz a confissão: 'Tu és o Cristo'?", opcoes: ["Capítulo 8", "Capítulo 1", "Capítulo 6", "Capítulo 12"], resposta: "Capítulo 8" },
      // Capítulo 9
      { pergunta: "Onde é narrada a gloriosa transfiguração de Jesus no monte?", opcoes: ["Capítulo 9", "Capítulo 4", "Capítulo 7", "Capítulo 11"], resposta: "Capítulo 9" },
      // Capítulo 10
      { pergunta: "Em qual capítulo Jesus abençoa as crianças e encontra o jovem rico?", opcoes: ["Capítulo 10", "Capítulo 3", "Capítulo 8", "Capítulo 15"], resposta: "Capítulo 10" },
      // Capítulo 11
      { pergunta: "Onde encontramos a entrada triunfal de Jesus em Jerusalém?", opcoes: ["Capítulo 11", "Capítulo 5", "Capítulo 9", "Capítulo 13"], resposta: "Capítulo 11" },
      // Capítulo 12
      { pergunta: "Em qual capítulo está registrada a oferta da viúva pobre?", opcoes: ["Capítulo 12", "Capítulo 2", "Capítulo 6", "Capítulo 14"], resposta: "Capítulo 12" },
      // Capítulo 13
      { pergunta: "Onde lemos o sermão profético sobre a destruição do templo e o fim dos tempos?", opcoes: ["Capítulo 13", "Capítulo 4", "Capítulo 8", "Capítulo 16"], resposta: "Capítulo 13" },
      // Capítulo 14
      { pergunta: "Em qual capítulo ocorre a instituição da Santa Ceia e a oração no Getsêmani?", opcoes: ["Capítulo 14", "Capítulo 3", "Capítulo 7", "Capítulo 11"], resposta: "Capítulo 14" },
      // Capítulo 15
      { pergunta: "Onde é narrada a crucificação, morte e sepultamento de Jesus?", opcoes: ["Capítulo 15", "Capítulo 5", "Capítulo 9", "Capítulo 12"], resposta: "Capítulo 15" },
      // Capítulo 16
      { pergunta: "Em qual capítulo lemos a ressurreição de Cristo e a Grande Comissão?", opcoes: ["Capítulo 16", "Capítulo 6", "Capítulo 10", "Capítulo 14"], resposta: "Capítulo 16" },

      // Perguntas complementares para fechar exatamente 40 itens abrangendo os capítulos principais
      { pergunta: "Qual capítulo relata a cura do leproso logo no início do ministério?", opcoes: ["Capítulo 1", "Capítulo 3", "Capítulo 5", "Capítulo 7"], resposta: "Capítulo 1" },
      { pergunta: "Em qual capítulo Jesus declara ser o Senhor do sábado?", opcoes: ["Capítulo 2", "Capítulo 4", "Capítulo 6", "Capítulo 8"], resposta: "Capítulo 2" },
      { pergunta: "Onde está registrada a parábola da candeia e do grão de mostarda?", opcoes: ["Capítulo 4", "Capítulo 2", "Capítulo 6", "Capítulo 10"], resposta: "Capítulo 4" },
      { pergunta: "Em qual capítulo Jesus acalma a tempestade no mar da Galileia?", opcoes: ["Capítulo 4", "Capítulo 7", "Capítulo 11", "Capítulo 15"], resposta: "Capítulo 4" },
      { pergunta: "Onde ocorre a cura do endemoninhado gadareno?", opcoes: ["Capítulo 5", "Capítulo 2", "Capítulo 6", "Capítulo 9"], resposta: "Capítulo 5" },
      { pergunta: "Qual capítulo relata a morte de João Batista decapitado por ordem de Herodes?", opcoes: ["Capítulo 6", "Capítulo 3", "Capítulo 8", "Capítulo 13"], resposta: "Capítulo 6" },
      { pergunta: "Em qual capítulo Jesus ensina que o que contamina o homem vem de dentro do coração?", opcoes: ["Capítulo 7", "Capítulo 2", "Capítulo 5", "Capítulo 11"], resposta: "Capítulo 7" },
      { pergunta: "Onde encontramos o segundo milagre da multiplicação dos pães?", opcoes: ["Capítulo 8", "Capítulo 4", "Capítulo 6", "Capítulo 10"], resposta: "Capítulo 8" },
      { pergunta: "Qual capítulo traz a cura do jovem possesso por um espírito mudo?", opcoes: ["Capítulo 9", "Capítulo 3", "Capítulo 7", "Capítulo 12"], resposta: "Capítulo 9" },
      { pergunta: "Em qual capítulo Jesus cura o cego Bartimeu à saída de Jericó?", opcoes: ["Capítulo 10", "Capítulo 4", "Capítulo 8", "Capítulo 14"], resposta: "Capítulo 10" },
      { pergunta: "Onde lemos sobre a maldição da figueira que secou?", opcoes: ["Capítulo 11", "Capítulo 2", "Capítulo 6", "Capítulo 10"], resposta: "Capítulo 11" },
      { pergunta: "Qual capítulo contém a parábola dos lavradores maus?", opcoes: ["Capítulo 12", "Capítulo 5", "Capítulo 9", "Capítulo 15"], resposta: "Capítulo 12" },
      { pergunta: "Em qual capítulo os fariseus questionam Jesus sobre o pagamento de tributo a César?", opcoes: ["Capítulo 12", "Capítulo 3", "Capítulo 7", "Capítulo 11"], resposta: "Capítulo 12" },
      { pergunta: "Onde se adverte sobre a necessidade de vigiar diante do dia e da hora desconhecidos?", opcoes: ["Capítulo 13", "Capítulo 1", "Capítulo 6", "Capítulo 10"], resposta: "Capítulo 13" },
      { pergunta: "Qual capítulo narra a unção de Jesus em Betânia com perfume de nardo puro?", opcoes: ["Capítulo 14", "Capítulo 4", "Capítulo 8", "Capítulo 12"], resposta: "Capítulo 14" },
      { pergunta: "Em qual capítulo Pedro nega a Jesus três vezes antes do cantar do galo?", opcoes: ["Capítulo 14", "Capítulo 7", "Capítulo 10", "Capítulo 13"], resposta: "Capítulo 14" },
      { pergunta: "Onde Jesus é interrogado por Pilatos e este solta a Barrabás?", opcoes: ["Capítulo 15", "Capítulo 3", "Capítulo 9", "Capítulo 11"], resposta: "Capítulo 15" },
      { pergunta: "Qual capítulo menciona José de Arimateia pedindo o corpo de Jesus para o sepultar?", opcoes: ["Capítulo 15", "Capítulo 2", "Capítulo 6", "Capítulo 10"], resposta: "Capítulo 15" },
      { pergunta: "Em qual capítulo as mulheres vão ao sepulcro e encontram a pedra a rolada?", opcoes: ["Capítulo 16", "Capítulo 5", "Capítulo 8", "Capítulo 12"], resposta: "Capítulo 16" },
      { pergunta: "Qual capítulo encerra o evangelho com a ascensão de Jesus aos céus?", opcoes: ["Capítulo 16", "Capítulo 4", "Capítulo 9", "Capítulo 14"], resposta: "Capítulo 16" },
      { pergunta: "Em qual capítulo Jesus dá vista ao cego em Betsaida?", opcoes: ["Capítulo 8", "Capítulo 3", "Capítulo 6", "Capítulo 11"], resposta: "Capítulo 8" },
      { pergunta: "Onde se relata a discussão dos discípulos sobre quem seria o maior no Reino?", opcoes: ["Capítulo 9", "Capítulo 2", "Capítulo 5", "Capítulo 10"], resposta: "Capítulo 9" },
      { pergunta: "Qual capítulo trata do ensinamento de Jesus sobre o divórcio?", opcoes: ["Capítulo 10", "Capítulo 4", "Capítulo 7", "Capítulo 13"], resposta: "Capítulo 10" },
      { pergunta: "Em qual capítulo os líderes religiosos questionam a autoridade de Jesus?", opcoes: ["Capítulo 11", "Capítulo 3", "Capítulo 6", "Capítulo 12"], resposta: "Capítulo 11" }
    ];

    function embaralhar(lista) {
      const copia = [...lista];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    let usuario = { nome: "", email: "" };
    let perguntas = [];
    let indice = 0;
    let respostas = [];

    const areaRegistro = document.getElementById("areaRegistro");
    const areaPergunta = document.getElementById("areaPergunta");
    const areaResultado = document.getElementById("resultado");

    const contadorPergunta = document.getElementById("contadorPergunta");
    const barra = document.getElementById("barra");
    const textoPergunta = document.getElementById("textoPergunta");
    const alternativas = document.getElementById("alternativas");
    const retorno = document.getElementById("retorno");
    const certas = document.getElementById("certas");
    const erradas = document.getElementById("erradas");
    const botaoInicio = document.getElementById("inicio");
    const botaoAnterior = document.getElementById("anterior");
    const botaoProxima = document.getElementById("proxima");

    function voltarParaSite() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "../index.html";
      }
    }

    function confirmarRegistro(event) {
      event.preventDefault();
      usuario.nome = document.getElementById("nomeUsuario").value.trim();
      usuario.email = document.getElementById("emailUsuario").value.trim();

      areaRegistro.classList.add("oculto");
      iniciarQuiz();
    }

    function atualizarPontuacao() {
      const totalCertas = respostas.filter(r => r !== null && r.correta).length;
      const totalErradas = respostas.filter(r => r !== null && !r.correta).length;

      certas.textContent = totalCertas;
      erradas.textContent = totalErradas;
    }

    function iniciarQuiz() {
      perguntas = embaralhar(perguntasOriginais).map(pergunta => ({
        ...pergunta,
        opcoesEmbaralhadas: embaralhar(pergunta.opcoes)
      }));

      indice = 0;
      respostas = Array(perguntas.length).fill(null);

      areaPergunta.classList.remove("oculto");
      areaResultado.classList.add("oculto");

      atualizarPontuacao();
      mostrarPergunta();
    }

    function responder(escolhida) {
      if (respostas[indice] !== null) return;

      const respostaCorreta = perguntas[indice].resposta;
      const correta = escolhida === respostaCorreta;

      respostas[indice] = { escolhida: escolhida, correta: correta };

      atualizarPontuacao();
      mostrarPergunta();
    }

    function mostrarPergunta() {
      const atual = perguntas[indice];
      const registro = respostas[indice];

      contadorPergunta.textContent = `Pergunta ${indice + 1} de ${perguntas.length}`;
      barra.style.width = `${((indice + 1) / perguntas.length) * 100}%`;

      textoPergunta.textContent = atual.pergunta;
      alternativas.innerHTML = "";
      retorno.textContent = "";
      retorno.className = "retorno";

      atual.opcoesEmbaralhadas.forEach(opcao => {
        const botao = document.createElement("button");
        botao.type = "button";
        botao.className = "alternativa";
        botao.textContent = opcao;

        if (registro !== null) {
          botao.disabled = true;

          if (opcao === atual.resposta) {
            botao.classList.add("certa");
          } else if (opcao === registro.escolhida) {
            botao.classList.add("errada");
          }
        } else {
          botao.addEventListener("click", () => responder(opcao));
        }

        alternativas.appendChild(botao);
      });

      if (registro !== null) {
        if (registro.correta) {
          retorno.textContent = "Correto! Muito bem.";
          retorno.classList.add("certa");
        } else {
          retorno.textContent = `Resposta incorreta. A alternativa certa é: ${atual.resposta}`;
          retorno.classList.add("errada");
        }
      }

      botaoInicio.disabled = indice === 0;
      botaoAnterior.disabled = indice === 0;
      botaoProxima.textContent = indice === perguntas.length - 1 ? "Ver Resultado" : "Próxima";

      atualizarPontuacao();
    }

    function irParaPergunta(novoIndice) {
      indice = novoIndice;
      mostrarPergunta();
    }

    function perguntaAnterior() {
      if (indice > 0) {
        indice--;
        mostrarPergunta();
      }
    }

    function proximaPergunta() {
      if (indice < perguntas.length - 1) {
        indice++;
        mostrarPergunta();
      } else {
        finalizarQuiz();
      }
    }

    function enviarEmailSilencioso(dados) {
      const endpoint = "https://formspree.io/f/mqpewwbg";

      const corpoMensagem = `RELATÓRIO DO QUIZ DO EVANGELHO DE MARCOS\n` +
        `----------------------------------------\n` +
        `Aluno/Membro: ${dados.nome}\n` +
        `E-mail do Aluno: ${dados.email}\n` +
        `Destino do Registro: ${EMAIL_DESTINO}\n` +
        `Aproveitamento: ${dados.porcentagem}%\n` +
        `Total de Questões: ${dados.total}\n` +
        `Acertos: ${dados.certas}\n` +
        `Erros: ${dados.erradas}\n` +
        `Data/Hora: ${new Date().toLocaleString('pt-BR')}\n` +
        `----------------------------------------`;

      fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: dados.nome,
          email: dados.email,
          _to: EMAIL_DESTINO,
          subject: `Resultado do Quiz de Marcos - ${dados.nome}`,
          message: corpoMensagem
        })
      }).catch(err => console.log("Envio automático executado."));
    }

    function finalizarQuiz() {
      areaPergunta.classList.add("oculto");
      areaResultado.classList.remove("oculto");

      const totalCertas = respostas.filter(r => r !== null && r.correta).length;
      const totalErradas = respostas.filter(r => r !== null && !r.correta).length;
      const porcentagem = Math.round((totalCertas / perguntas.length) * 100);

      const dadosResultado = {
        nome: usuario.nome,
        email: usuario.email,
        certas: totalCertas,
        erradas: totalErradas,
        total: perguntas.length,
        porcentagem: porcentagem
      };

      enviarEmailSilencioso(dadosResultado);

      areaResultado.innerHTML = `
        <h2>Quiz Concluído com Sucesso!</h2>
        <p class="mensagem-final">Paz de Deus, <strong>${usuario.nome}</strong>! Aqui está o seu desempenho:</p>
        <div class="nota">${porcentagem}%</div>
        <p class="mensagem-final">Você acertou <strong>${totalCertas}</strong> de <strong>${perguntas.length}</strong> perguntas.</p>

        <div class="status-envio">
          ✅ O resultado foi enviado automaticamente para <strong>${EMAIL_DESTINO}</strong>.
        </div>

        <br><br>
        <button class="controle" onclick="reiniciarQuiz()">Refazer Quiz</button>
      `;
    }

    function reiniciarQuiz() {
      areaResultado.classList.add("oculto");
      areaRegistro.classList.remove("oculto");
    }
  </script>
</body>
</html>
