<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz do Evangelho de Marcos</title>

  <style>
    :root {
      --dourado: #c9a64f;
      --dourado-escuro: #a9842f;
      --fundo: #242424;
      --cartao: #fffefa;
      --texto: #252525;
      --suave: #777;
      --verde: #237a45;
      --vermelho: #b73535;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(760px, 100%);
    }

    .cartao {
      background: var(--cartao);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 18px 55px #0005;
    }

    header {
      border-bottom: 1px solid #eee;
      padding-bottom: 18px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 4.5vw, 34px);
    }

    .subtitulo {
      color: var(--suave);
      line-height: 1.5;
      margin: 0 0 24px;
    }

    .campo-identificacao {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .campo-identificacao input {
      padding: 14px;
      border: 1px solid #e7dfca;
      border-radius: 10px;
      font-size: 16px;
      background: #fdfbf7;
    }

    .contador-pergunta {
      color: var(--suave);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .barra-fundo {
      height: 8px;
      overflow: hidden;
      background: #eee9dc;
      border-radius: 99px;
      margin-bottom: 25px;
    }

    .barra {
      height: 100%;
      width: 0;
      background: var(--dourado);
      transition: width 0.25s ease;
    }

    .pergunta {
      font-size: clamp(19px, 3.8vw, 24px);
      line-height: 1.4;
      margin: 0 0 22px;
    }

    .alternativas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .alternativa {
      min-height: 58px;
      padding: 14px 16px;
      border: 1px solid #e7dfca;
      border-radius: 14px;
      background: #f4efe1;
      color: var(--texto);
      text-align: left;
      font-size: 15px;
      line-height: 1.3;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border 0.15s;
    }

    .alternativa:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--dourado);
      background: #eee3c5;
    }

    .alternativa:disabled {
      cursor: default;
    }

    .alternativa.certa {
      background: #e1f2e6;
      border-color: var(--verde);
      color: #155a30;
      font-weight: bold;
    }

    .alternativa.errada {
      background: #fae5e3;
      border-color: var(--vermelho);
      color: #8c2222;
      font-weight: bold;
    }

    .retorno {
      min-height: 28px;
      margin: 17px 0 0;
      font-weight: bold;
      line-height: 1.5;
    }

    .retorno.certa {
      color: var(--verde);
    }

    .retorno.errada {
      color: var(--vermelho);
    }

    .painel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .pontuacao {
      display: flex;
      gap: 16px;
      color: var(--suave);
      font-size: 14px;
    }

    .pontuacao strong {
      color: var(--texto);
    }

    .botoes {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    button.controle {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--dourado);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    button.controle:hover:not(:disabled) {
      background: var(--dourado-escuro);
    }

    button.controle.secundario {
      background: #eee9dc;
      color: var(--texto);
    }

    button.controle.voltar-site {
      background: #333;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.controle.voltar-site:hover {
      background: #555;
    }

    button.controle:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .resultado {
      text-align: center;
      padding: 20px 0 8px;
    }

    .resultado h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      margin: 0 0 10px;
    }

    .nota {
      font-size: 54px;
      font-weight: bold;
      color: var(--dourado-escuro);
      margin: 14px 0;
    }

    .mensagem-final {
      color: var(--suave);
      font-size: 17px;
      line-height: 1.6;
    }

    .status-envio {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #e1f2e6;
      border: 1px solid var(--verde);
      color: #155a30;
      font-weight: bold;
      font-size: 15px;
    }

    .oculto {
      display: none;
    }

    @media (max-width: 560px) {
      .cartao {
        padding: 23px 18px;
      }

      .alternativas {
        grid-template-columns: 1fr;
      }

      .painel {
        align-items: stretch;
      }

      .pontuacao {
        width: 100%;
      }

      .botoes {
        width: 100%;
      }

      .botoes button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="cartao">
      <header>
        <h1>Quiz do Evangelho de Marcos</h1>
        <button class="controle voltar-site" onclick="voltarParaSite()">
          ⬅ Voltar ao Site
        </button>
      </header>

      <!-- Tela 1: Identificação de Nome e E-mail -->
      <div id="areaRegistro">
        <p class="subtitulo">
          A Paz de Deus! Antes de começar o questionário sobre o Evangelho de Marcos, informe o seu Nome e o seu E-mail para registrar o seu resultado.
        </p>
        <form id="formRegistro" class="campo-identificacao" onsubmit="confirmarRegistro(event)">
          <input type="text" id="nomeUsuario" placeholder="Seu Nome Completo" required>
          <input type="email" id="emailUsuario" placeholder="Seu E-mail" required>
          <button type="submit" class="controle">Iniciar Quiz</button>
        </form>
      </div>

      <!-- Tela 2: Pergunta do Quiz -->
      <div id="areaPergunta" class="oculto">
        <div class="contador-pergunta" id="contadorPergunta"></div>

        <div class="barra-fundo">
          <div class="barra" id="barra"></div>
        </div>

        <h2 class="pergunta" id="textoPergunta"></h2>
        <div class="alternativas" id="alternativas"></div>
        <p class="retorno" id="retorno" aria-live="polite"></p>

        <div class="painel">
          <div class="pontuacao">
            <span>✅ Certas: <strong id="certas">0</strong></span>
            <span>❌ Erradas: <strong id="erradas">0</strong></span>
          </div>

          <div class="botoes">
            <button class="controle secundario" id="inicio" onclick="irParaPergunta(0)">
              Primeira
            </button>
            <button class="controle secundario" id="anterior" onclick="perguntaAnterior()">
              Anterior
            </button>
            <button class="controle" id="proxima" onclick="proximaPergunta()">
              Próxima
            </button>
          </div>
        </div>
      </div>

      <!-- Tela 3: Resultado Final -->
      <div class="resultado oculto" id="resultado"></div>
    </section>
  </main>

  <script>
    // Configuração do e-mail de destino fixo
    const EMAIL_DESTINO = "comumcongregacao@gmail.com";

    // Banco com 40 perguntas cobrindo todas as epígrafes do Evangelho de Marcos (1 a 16)
    const perguntasOriginais = [
      { pergunta: "Em qual capítulo está a epígrafe 'João Batista e a pregação do arrependimento'?", opcoes: ["Capítulo 1", "Capítulo 3", "Capítulo 5", "Capítulo 8"], resposta: "Capítulo 1" },
      { pergunta: "Onde encontramos a epígrafe 'O batismo e a tentação de nosso Senhor Jesus Cristo'?", opcoes: ["Capítulo 1", "Capítulo 2", "Capítulo 4", "Capítulo 6"], resposta: "Capítulo 1" },
      { pergunta: "A epígrafe 'A vocação dos primeiros discípulos' pertence a qual capítulo?", opcoes: ["Capítulo 1", "Capítulo 2", "Capítulo 4", "Capítulo 5"], resposta: "Capítulo 1" },
      { pergunta: "Em qual capítulo fica a epígrafe 'A cura da sogra de Pedro e de outros enfermos'?", opcoes: ["Capítulo 1", "Capítulo 5", "Capítulo 7", "Capítulo 11"], resposta: "Capítulo 1" },
      { pergunta: "A epígrafe 'A cura de um leprosos' está localizada em qual capítulo?", opcoes: ["Capítulo 1", "Capítulo 4", "Capítulo 8", "Capítulo 12"], resposta: "Capítulo 1" },

      { pergunta: "A epígrafe 'A cura de um paralítico em Cafarnaum' é encontrada em qual capítulo?", opcoes: ["Capítulo 2", "Capítulo 1", "Capítulo 3", "Capítulo 5"], resposta: "Capítulo 2" },
      { pergunta: "Em qual capítulo está registrada a epígrafe 'A vocação de Levi'?", opcoes: ["Capítulo 2", "Capítulo 4", "Capítulo 6", "Capítulo 8"], resposta: "Capítulo 2" },
      { pergunta: "Onde fica a epígrafe 'A questão sobre o jejum'?", opcoes: ["Capítulo 2", "Capítulo 3", "Capítulo 7", "Capítulo 10"], resposta: "Capítulo 2" },
      { pergunta: "A epígrafe 'Nosso Senhor Jesus Cristo é o Senhor do sábado' pertence a qual capítulo?", opcoes: ["Capítulo 2", "Capítulo 1", "Capítulo 5", "Capítulo 9"], resposta: "Capítulo 2" },

      { pergunta: "Em qual capítulo está 'A cura do homem com uma das mãos res
