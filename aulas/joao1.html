<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz da Primeira Epístola de João</title>

  <!-- Biblioteca EmailJS para envio automático de e-mails -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    :root {
      --dourado: #c9a64f;
      --dourado-escuro: #a9842f;
      --fundo: #242424;
      --cartao: #fffefa;
      --texto: #252525;
      --suave: #777;
      --verde: #237a45;
      --vermelho: #b73535;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(760px, 100%);
    }

    .cartao {
      background: var(--cartao);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 18px 55px #0005;
    }

    header {
      border-bottom: 1px solid #eee;
      padding-bottom: 18px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 4.5vw, 34px);
    }

    .subtitulo {
      color: var(--suave);
      line-height: 1.5;
      margin: 0 0 24px;
    }

    .campo-identificacao {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    .campo-identificacao input {
      padding: 14px;
      border: 1px solid #e7dfca;
      border-radius: 10px;
      font-size: 16px;
      background: #fdfbf7;
    }

    .contador-pergunta {
      color: var(--suave);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .barra-fundo {
      height: 8px;
      overflow: hidden;
      background: #eee9dc;
      border-radius: 99px;
      margin-bottom: 25px;
    }

    .barra {
      height: 100%;
      width: 0;
      background: var(--dourado);
      transition: width 0.25s ease;
    }

    .pergunta {
      font-size: clamp(19px, 3.8vw, 24px);
      line-height: 1.4;
      margin: 0 0 22px;
    }

    .alternativas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .alternativa {
      min-height: 58px;
      padding: 14px 16px;
      border: 1px solid #e7dfca;
      border-radius: 14px;
      background: #f4efe1;
      color: var(--texto);
      text-align: left;
      font-size: 15px;
      line-height: 1.3;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border 0.15s;
    }

    .alternativa:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--dourado);
      background: #eee3c5;
    }

    .alternativa:disabled {
      cursor: default;
    }

    .alternativa.certa {
      background: #e1f2e6;
      border-color: var(--verde);
      color: #155a30;
      font-weight: bold;
    }

    .alternativa.errada {
      background: #fae5e3;
      border-color: var(--vermelho);
      color: #8c2222;
      font-weight: bold;
    }

    .retorno {
      min-height: 28px;
      margin: 17px 0 0;
      font-weight: bold;
      line-height: 1.5;
    }

    .retorno.certa {
      color: var(--verde);
    }

    .retorno.errada {
      color: var(--vermelho);
    }

    .painel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .pontuacao {
      display: flex;
      gap: 16px;
      color: var(--suave);
      font-size: 14px;
    }

    .pontuacao strong {
      color: var(--texto);
    }

    .botoes {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    button.controle {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--dourado);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    button.controle:hover:not(:disabled) {
      background: var(--dourado-escuro);
    }

    button.controle.secundario {
      background: #eee9dc;
      color: var(--texto);
    }

    button.controle.voltar-site {
      background: #333;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.controle.voltar-site:hover {
      background: #555;
    }

    button.controle:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .resultado {
      text-align: center;
      padding: 20px 0 8px;
    }

    .resultado h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      margin: 0 0 10px;
    }

    .nota {
      font-size: 54px;
      font-weight: bold;
      color: var(--dourado-escuro);
      margin: 14px 0;
    }

    .mensagem-final {
      color: var(--suave);
      font-size: 17px;
      line-height: 1.6;
    }

    .status-email {
      margin-top: 15px;
      font-weight: bold;
      color: var(--verde);
    }

    .oculto {
      display: none;
    }

    @media (max-width: 560px) {
      .cartao {
        padding: 23px 18px;
      }

      .alternativas {
        grid-template-columns: 1fr;
      }

      .painel {
        align-items: stretch;
      }

      .pontuacao {
        width: 100%;
      }

      .botoes {
        width: 100%;
      }

      .botoes button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="cartao">
      <header>
        <h1>Quiz da Primeira Epístola de João</h1>
        <button class="controle voltar-site" onclick="voltarParaSite()">
          ⬅ Voltar ao Site
        </button>
      </header>

      <!-- Tela 1: Identificação de Nome e E-mail -->
      <div id="areaRegistro">
        <p class="subtitulo">
          A Paz de Deus! Antes de começar o questionário sobre a Primeira Epístola de João, informe o seu Nome e o seu E-mail para registrar o seu resultado.
        </p>
        <form id="formRegistro" class="campo-identificacao" onsubmit="confirmarRegistro(event)">
          <input type="text" id="nomeUsuario" placeholder="Seu Nome Completo" required>
          <input type="email" id="emailUsuario" placeholder="Seu E-mail" required>
          <button type="submit" class="controle">Iniciar Quiz</button>
        </form>
      </div>

      <!-- Tela 2: Pergunta do Quiz -->
      <div id="areaPergunta" class="oculto">
        <div class="contador-pergunta" id="contadorPergunta"></div>

        <div class="barra-fundo">
          <div class="barra" id="barra"></div>
        </div>

        <h2 class="pergunta" id="textoPergunta"></h2>
        <div class="alternativas" id="alternativas"></div>
        <p class="retorno" id="retorno" aria-live="polite"></p>

        <div class="painel">
          <div class="pontuacao">
            <span>✅ Certas: <strong id="certas">0</strong></span>
            <span>❌ Erradas: <strong id="erradas">0</strong></span>
          </div>

          <div class="botoes">
            <button class="controle secundario" id="inicio">
              Primeira pergunta
            </button>
            <button class="controle secundario" id="anterior">
              Anterior
            </button>
            <button class="controle" id="proxima">
              Próxima
            </button>
          </div>
        </div>
      </div>

      <!-- Tela 3: Resultado e Envio por E-mail -->
      <div class="resultado oculto" id="resultado"></div>
    </section>
  </main>

  <script>
    // Inicializar EmailJS (Substitua "YOUR_PUBLIC_KEY" caso use uma conta própria no emailjs.com)
    (function() {
        emailjs.init("YOUR_PUBLIC_KEY"); 
    })();

    // 20 perguntas baseadas nos 5 capítulos e epígrafes de 1 João (João Ferreira de Almeida)
    const perguntasOriginais = [
      // Capítulo 1
      { pergunta: "O testemunho sobre a Palavra da Vida, a quem os apóstolos viram, ouviram e apalparam, encontra-se no:", opcoes: ["Capítulo 1", "Capítulo 2", "Capítulo 3", "Capítulo 4"], resposta: "Capítulo 1" },
      { pergunta: "A declaração de que 'Deus é luz, e não há nele treva alguma' pertence ao:", opcoes: ["Capítulo 1", "Capítulo 2", "Capítulo 3", "Capítulo 5"], resposta: "Capítulo 1" },
      { pergunta: "A afirmação de que se andarmos na luz, temos comunhão uns com os outros, e o sangue de Jesus Cristo nos purifica de todo pecado está no:", opcoes: ["Capítulo 1", "Capítulo 2", "Capítulo 4", "Capítulo 5"], resposta: "Capítulo 1" },
      { pergunta: "A doutrina da confissão de pecados ('Se confessarmos os nossos pecados, ele é fiel e justo para nos perdoar...') encontra-se no:", opcoes: ["Capítulo 1", "Capítulo 3", "Capítulo 4", "Capítulo 5"], resposta: "Capítulo 1" },

      // Capítulo 2
      { pergunta: "O ensino de que se alguém pecar, temos um Advogado para com o Pai, Jesus Cristo, o justo, que é a propiciação pelos nossos pecados, pertence ao:", opcoes: ["Capítulo 2", "Capítulo 1", "Capítulo 3", "Capítulo 4"], resposta: "Capítulo 2" },
      { pergunta: "A apresentação do novo e antigo mandamento sobre amar o irmão e não andar em trevas encontra-se no:", opcoes: ["Capítulo 2", "Capítulo 1", "Capítulo 4", "Capítulo 5"], resposta: "Capítulo 2" },
      { pergunta: "A mensagem dirigida especificamente a 'filhinhos, pais e jovens' sobre o conhecimento do Pai e a vitória sobre o maligno está no:", opcoes: ["Capítulo 2", "Capítulo 3", "Capítulo 4", "Capítulo 5"], resposta: "Capítulo 2" },
      { pergunta: "A exortação 'Não ameis o mundo, nem o que no mundo há', pois quem ama o mundo não tem o amor do Pai, pertence ao:", opcoes: ["Capítulo 2", "Capítulo 1", "Capítulo 3", "Capítulo 5"], resposta: "Capítulo 2" },
      { pergunta: "A advertência sobre a chegada da última hora, o surgimento de muitos anticristos e a unção recebida do Santo encontra-se no:", opcoes: ["Capítulo 2", "Capítulo 3", "Capítulo 4", "Capítulo 5"], resposta: "Capítulo 2" },

      // Capítulo 3
      { pergunta: "A declaração sobre o grande amor do Pai ao nos conceder o sermos chamados filhos de Deus e a promessa de ser-lhe semelhantes pertence ao:", opcoes: ["Capítulo 3", "Capítulo 1", "Capítulo 2", "Capítulo 4"], resposta: "Capítulo 3" },
      { pergunta: "A verdade de que qualquer que permanece nele não vive na prática do pecado e que o Filho de Deus se manifestou para desfazer as obras do diabo está no:", opcoes: ["Capítulo 3", "Capítulo 2", "Capítulo 4", "Capítulo 5"], resposta: "Capítulo 3" },
      { pergunta: "A menção a Caim, que era do maligno e matou seu irmão, como exemplo negativo de amor fraternal encontra-se no:", opcoes: ["Capítulo 3", "Capítulo 1", "Capítulo 4", "Capítulo 5"], resposta: "Capítulo 3" },
      { pergunta: "A exortação para não amarmos de palavra, nem de língua, mas por obra e em verdade está no:", opcoes: ["Capítulo 3", "Capítulo 2", "Capítulo 4", "Capítulo 5"], resposta: "Capítulo 3" },

      // Capítulo 4
      { pergunta: "A ordem para provar os espíritos para ver se vêm de Deus, pois muitos falsos profetas se têm levantado no mundo, pertence ao:", opcoes: ["Capítulo 4", "Capítulo 1", "Capítulo 2", "Capítulo 3"], resposta: "Capítulo 4" },
      { pergunta: "O critério de que todo espírito que confessa que Jesus Cristo veio em carne é de Deus encontra-se no:", opcoes: ["Capítulo 4", "Capítulo 2", "Capítulo 3", "Capítulo 5"], resposta: "Capítulo 4" },
      { pergunta: "A célebre declaração de que 'Deus é amor' e de que aquele que não ama não conhece a Deus está no:", opcoes: ["Capítulo 4", "Capítulo 1", "Capítulo 3", "Capítulo 5"], resposta: "Capítulo 4" },
      { pergunta: "O ensino de que no amor não há temor, antes o perfeito amor lança fora o temor, pertence ao:", opcoes: ["Capítulo 4", "Capítulo 2", "Capítulo 3", "Capítulo 5"], resposta: "Capítulo 4" },

      // Capítulo 5
      { pergunta: "A afirmação de que 'esta é a vitória que vence o mundo, a nossa fé' encontra-se no:", opcoes: ["Capítulo 5", "Capítulo 1", "Capítulo 2", "Capítulo 4"], resposta: "Capítulo 5" },
      { pergunta: "A passagem que trata dos
