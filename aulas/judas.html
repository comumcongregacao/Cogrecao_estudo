<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz da Epístola de Judas</title>

  <style>
    :root {
      --dourado: #c9a64f;
      --dourado-escuro: #a9842f;
      --fundo: #242424;
      --cartao: #fffefa;
      --texto: #252525;
      --suave: #777;
      --verde: #237a45;
      --vermelho: #b73535;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--fundo);
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(760px, 100%);
    }

    .cartao {
      background: var(--cartao);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 18px 55px #0005;
    }

    header {
      border-bottom: 1px solid #eee;
      padding-bottom: 18px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 4.5vw, 34px);
    }

    .subtitulo {
      color: var(--suave);
      line-height: 1.5;
      margin: 0 0 24px;
    }

    .contador-pergunta {
      color: var(--suave);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .barra-fundo {
      height: 8px;
      overflow: hidden;
      background: #eee9dc;
      border-radius: 99px;
      margin-bottom: 25px;
    }

    .barra {
      height: 100%;
      width: 0;
      background: var(--dourado);
      transition: width 0.25s ease;
    }

    .pergunta {
      font-size: clamp(19px, 3.8vw, 24px);
      line-height: 1.4;
      margin: 0 0 22px;
    }

    .alternativas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .alternativa {
      min-height: 58px;
      padding: 14px 16px;
      border: 1px solid #e7dfca;
      border-radius: 14px;
      background: #f4efe1;
      color: var(--texto);
      text-align: left;
      font-size: 15px;
      line-height: 1.3;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border 0.15s;
    }

    .alternativa:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--dourado);
      background: #eee3c5;
    }

    .alternativa:disabled {
      cursor: default;
    }

    .alternativa.certa {
      background: #e1f2e6;
      border-color: var(--verde);
      color: #155a30;
      font-weight: bold;
    }

    .alternativa.errada {
      background: #fae5e3;
      border-color: var(--vermelho);
      color: #8c2222;
      font-weight: bold;
    }

    .retorno {
      min-height: 28px;
      margin: 17px 0 0;
      font-weight: bold;
      line-height: 1.5;
    }

    .retorno.certa {
      color: var(--verde);
    }

    .retorno.errada {
      color: var(--vermelho);
    }

    .painel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .pontuacao {
      display: flex;
      gap: 16px;
      color: var(--suave);
      font-size: 14px;
    }

    .pontuacao strong {
      color: var(--texto);
    }

    .botoes {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    button.controle {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--dourado);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    button.controle:hover:not(:disabled) {
      background: var(--dourado-escuro);
    }

    button.controle.secundario {
      background: #eee9dc;
      color: var(--texto);
    }

    button.controle.voltar-site {
      background: #333;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.controle.voltar-site:hover {
      background: #555;
    }

    button.controle:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .resultado {
      text-align: center;
      padding: 20px 0 8px;
    }

    .resultado h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      margin: 0 0 10px;
    }

    .nota {
      font-size: 54px;
      font-weight: bold;
      color: var(--dourado-escuro);
      margin: 14px 0;
    }

    .mensagem-final {
      color: var(--suave);
      font-size: 17px;
      line-height: 1.6;
    }

    .oculto {
      display: none;
    }

    @media (max-width: 560px) {
      .cartao {
        padding: 23px 18px;
      }

      .alternativas {
        grid-template-columns: 1fr;
      }

      .painel {
        align-items: stretch;
      }

      .pontuacao {
        width: 100%;
      }

      .botoes {
        width: 100%;
      }

      .botoes button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="cartao">
      <header>
        <h1>Quiz da Epístola de Judas</h1>
        <button class="controle voltar-site" onclick="voltarParaSite()">
          ⬅ Voltar ao Site
        </button>
      </header>

      <p class="subtitulo">
        Responda às 10 perguntas sobre os versículos e temas centrais da Epístola de Judas (JFA).
        As perguntas e alternativas são embaralhadas a cada tentativa.
      </p>

      <div id="areaPergunta">
        <div class="contador-pergunta" id="contadorPergunta"></div>

        <div class="barra-fundo">
          <div class="barra" id="barra"></div>
        </div>

        <h2 class="pergunta" id="textoPergunta"></h2>
        <div class="alternativas" id="alternativas"></div>
        <p class="retorno" id="retorno" aria-live="polite"></p>

        <div class="painel">
          <div class="pontuacao">
            <span>✅ Certas: <strong id="certas">0</strong></span>
            <span>❌ Erradas: <strong id="erradas">0</strong></span>
          </div>

          <div class="botoes">
            <button class="controle secundario" id="inicio">
              Primeira pergunta
            </button>
            <button class="controle secundario" id="anterior">
              Anterior
            </button>
            <button class="controle" id="proxima">
              Próxima
            </button>
          </div>
        </div>
      </div>

      <div class="resultado oculto" id="resultado"></div>
    </section>
  </main>

  <script>
    // 10 perguntas fidedignas aos versículos de Judas (João Ferreira de Almeida)
    const perguntasOriginais = [
      {
        pergunta: "Qual foi o motivo pelo qual Judas sentiu necessidade de escrever exortando os fiéis nos versículos 3 e 4?",
        opcoes: [
          "Para que batalhassem pela fé que uma vez foi dada aos santos, pois homens ímpios se introduziram dissimuladamente",
          "Para organizar a coleta de ofertas para os pobres de Jerusalém",
          "Para estabelecer as regras de escolha de bispos e diáconos",
          "Para anunciar sua próxima viagem à cidade de Roma"
        ],
        resposta: "Para que batalhassem pela fé que uma vez foi dada aos santos, pois homens ímpios se introduziram dissimuladamente"
      },
      {
        pergunta: "Segundo os versículos 5 e 6, quais dois exemplos de juízo antigo Judas lembra para advertir os leitores?",
        opcoes: [
          "O povo tirado do Egito que depois foi destruído por não crer, e os anjos que não guardaram seu principado",
          "A torre de Babel e o dilúvio dos dias de Noé",
          "O cativeiro na Babilônia e a queda das muralhas de Jericó",
          "A praga dos gafanhotos e a divisão do Reino de Israel"
        ],
        resposta: "O povo tirado do Egito que depois foi destruído por não crer, e os anjos que não guardaram seu principado"
      },
      {
        pergunta: "O que aconteceu com Sodoma e Gomorra e as cidades vizinhas por se haverem entregue à prostituição, segundo o versículo 7?",
        opcoes: [
          "Foram postas por exemplo, sofrendo a pena do fogo eterno",
          "Foram perdoadas após quarenta dias de jejum",
          "Foram transformadas em grandes centros de comércio",
          "Foram reconstruídas pelo rei de Canaã"
        ],
        resposta: "Foram postas por exemplo, sofrendo a pena do fogo eterno"
      },
      {
        pergunta: "No versículo 9, como o arcanjo Miguel agiu ao disputar o corpo de Moisés com o diabo?",
        opcoes: [
          "Não ousou pronunciar juízo de maldição, mas disse: O Senhor te repreenda",
          "Lançou o diabo no lago de fogo imediatamente",
          "Usou a espada para derrotar fisicamente o adversário",
          "Fez um acordo de paz com o acusador"
        ],
        resposta: "Não ousou pronunciar juízo de maldição, mas disse: O Senhor te repreenda"
      },
      {
        pergunta: "Quais são os três caminhos e erros do passado aos quais os falsos mestres são comparados no versículo 11?",
        opcoes: [
          "O caminho de Caim, o erro de Balaão e a contradição de Coré",
          "O pecado de Adão, a covardia de Jonas e o orgulho de Golias",
          "A mentira de Ananias, a inveja de Saul e a idolatria de Acabe",
          "O engano de Jacó, a dúvida de Tomé e a negação de Pedro"
        ],
        resposta: "O caminho de Caim, o erro de Balaão e a contradição de Coré"
      },
      {
        pergunta: "Como o versículo 12 descreve poeticamente os falsos mestres que se banqueteiam sem temor?",
        opcoes: [
          "Manchas em vossas festas de amor, nuvens sem água levadas pelos ventos, árvores murchas e infrutíferas",
          "Lobos vestidos de ovelhas prontos para devorar o rebanho",
          "Serpentes venenosas escondidas na relva",
          "Torres altas construídas sobre a areia"
        ],
        resposta: "Manchas em vossas festas de amor, nuvens sem água levadas pelos ventos, árvores murchas e infrutíferas"
      },
      {
        pergunta: "Qual profeta antigo, o sétimo depois de Adão, profetizou sobre a vinda do Senhor com milhares de Seus santos para fazer juízo? (vv. 14 e 15)",
        opcoes: ["Enoque", "Noé", "Abraão", "Moisés"],
        resposta: "Enoque"
      },
      {
        pergunta: "Qual instrução prática é dada aos amados nos versículos 20 e 21 para se manterem firmes?",
        opcoes: [
          "Edificando-se sobre a sua santíssima fé, orando no Espírito Santo e conservando-se no amor de Deus",
          "Isolando-se completamente em desertos e cavernas",
          "Desafiando publicamente os governantes civis",
          "Acumulando bens para distribuir apenas entre os parentes"
        ],
        resposta: "Edificando-se sobre a sua santíssima fé, orando no Espírito Santo e conservando-se no amor de Deus"
      },
      {
        pergunta: "De acordo com os versículos 22 e 23, como os cristãos devem tratar os que estão duvidando ou em perigo espiritual?",
        opcoes: [
          "Compaixão dos que estão em dúvida, e salvar alguns com temor, tirando-os do fogo",
          "Afastando-se imediatamente sem lhes dirigir a palavra",
          "Denunciando-os publicamente ao tribunal civil",
          "Ignorando o erro para não causar discórdia"
        ],
        resposta: "Compaixão dos que estão em dúvida, e salvar alguns com temor, tirando-os do fogo"
      },
      {
        pergunta: "Como Judas encerra a sua epístola na famosa doxologia final dos versículos 24 e 25?",
        opcoes: [
          "Àquele que é poderoso para vos guardar de tropeçar e apresentar-vos irrepreensíveis perante a sua glória... seja glória e majestade",
          "Pedindo que enviem saudações a todos os irmãos da Itália",
          "Recomendando que guardem esta carta junto com as leis de Moisés",
          "Desejando boa sorte e saúde a todos os bispos locais"
        ],
        resposta: "Àquele que é poderoso para vos guardar de tropeçar e apresentar-vos irrepreensíveis perante a sua glória... seja glória e majestade"
      }
    ];

    function embaralhar(lista) {
      const copia = [...lista];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    let perguntas = [];
    let indice = 0;
    let respostas = [];

    const contadorPergunta = document.getElementById("contadorPergunta");
    const barra = document.getElementById("barra");
    const textoPergunta = document.getElementById("textoPergunta");
    const alternativas = document.getElementById("alternativas");
    const retorno = document.getElementById("retorno");
    const certas = document.getElementById("certas");
    const erradas = document.getElementById("erradas");
    const botaoInicio = document.getElementById("inicio");
    const botaoAnterior = document.getElementById("anterior");
    const botaoProxima = document.getElementById("proxima");
    const areaPergunta = document.getElementById("areaPergunta");
    const areaResultado = document.getElementById("resultado");

    function voltarParaSite() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    }

    function atualizarPontuacao() {
      const totalCertas = respostas.filter(
        resposta => resposta !== null && resposta.correta
      ).length;

      const totalErradas = respostas.filter(
        resposta => resposta !== null && !resposta.correta
      ).length;

      certas.textContent = totalCertas;
      erradas.textContent = totalErradas;
    }

    function iniciarQuiz() {
      perguntas = embaralhar(perguntasOriginais).map(pergunta => ({
        ...pergunta,
        opcoesEmbaralhadas: embaralhar(pergunta.opcoes)
      }));

      indice = 0;
      respostas = Array(perguntas.length).fill(null);

      areaPergunta.classList.remove("oculto");
      areaResultado.classList.add("oculto");

      atualizarPontuacao();
      mostrarPergunta();
    }

    function responder(escolhida) {
      if (respostas[indice] !== null) {
        return;
      }

      const respostaCorreta = perguntas[indice].resposta;
      const correta = escolhida === respostaCorreta;

      respostas[indice] = {
        escolhida: escolhida,
        correta: correta
      };

      atualizarPontuacao();
      mostrarPergunta();
    }

    function mostrarPergunta() {
      const atual = perguntas[indice];
      const registro = respostas[indice];

      contadorPergunta.textContent =
        `Pergunta ${indice + 1} de ${perguntas.length}`;

      barra.style.width =
        `${((indice + 1) / perguntas.length) * 100}%`;

      textoPergunta.textContent = atual.pergunta;
      alternativas.innerHTML = "";
      retorno.textContent = "";
      retorno.className = "retorno";

      atual.opcoesEmbaralhadas.forEach(opcao => {
        const botao = document.createElement("button");
        botao.type = "button";
        botao.className = "alternativa";
        botao.textContent = opcao;

        if (registro !== null) {
          botao.disabled = true;

          if (opcao === atual.resposta) {
            botao.classList.add("certa");
          } else if (opcao === registro.escolhida) {
            botao.classList.add("errada");
          }
        } else {
          botao.addEventListener("click", () => responder(opcao));
        }

        alternativas.appendChild(botao);
      });

      if (registro !== null) {
        if (registro.correta) {
          retorno.textContent = "Correto! Muito bem.";
          retorno.classList.add("certa");
        } else {
          retorno.textContent =
            `Resposta incorreta. A alternativa certa é: ${atual.resposta}`;
          retorno.classList.add("errada");
        }
      }

      botaoInicio.disabled = indice === 0;
      botaoAnterior.disabled = indice === 0;

      botaoProxima.textContent =
        indice === perguntas.length - 1 ? "Ver resultado" : "Próxima";

      atualizarPontuacao();
    }

    function mostrarResultado() {
      const totalCertas = respostas.filter(
        resposta => resposta !== null && resposta.correta
      ).length;

      const totalErradas = respostas.filter(
        resposta => resposta !== null && !resposta.correta
      ).length;

      const porcentagem = Math.round(
        (totalCertas / perguntas.length) * 100
      );

      let nivel;
      let mensagem;

      if (porcentagem < 25) {
        nivel = "Insuficiente";
        mensagem = "Leia os 25 versículos da Epístola de Judas e tente novamente.";
      } else if (porcentagem < 50) {
        nivel = "Médio";
        mensagem = "Você entendeu alguns pontos da carta, mas vale a pena revisar seus versículos.";
      } else if (porcentagem < 75) {
        nivel = "Bom";
        mensagem = "Muito bem! Você demonstrou ótimo conhecimento sobre a Epístola de Judas.";
      } else {
        nivel = "Excelente";
        mensagem = "Excelente! Você domina os ensinamentos, alertas e doxologia da Epístola de Judas!";
      }

      areaPergunta.classList.add("oculto");
      areaResultado.classList.remove("oculto");

      areaResultado.innerHTML = `
        <h2>Resultado final</h2>
        <div class="nota">${porcentagem}%</div>
        <p><strong>${nivel}</strong></p>
        <p class="mensagem-final">
          Você acertou <strong>${totalCertas}</strong> e errou
          <strong>${totalErradas}</strong> de ${perguntas.length} perguntas.<br>
          ${mensagem}
        </p>

        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px;">
          <button class="controle" id="novaTentativa">Nova tentativa</button>
          <button class="controle secundario" onclick="voltarParaSite()">Voltar ao Site</button>
        </div>
      `;

      document
        .getElementById("novaTentativa")
        .addEventListener("click", iniciarQuiz);
    }

    botaoInicio.addEventListener("click", () => {
      indice = 0;
      mostrarPergunta();
    });

    botaoAnterior.addEventListener("click", () => {
      if (indice > 0) {
        indice--;
        mostrarPergunta();
      }
    });

    botaoProxima.addEventListener("click", () => {
      if (indice < perguntas.length - 1) {
        indice++;
        mostrarPergunta();
      } else {
        mostrarResultado();
      }
    });

    iniciarQuiz();
  </script>
</body>
</html>
